name: Build Uranium Matrix Nexus v1000 APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: "latest"
        packages: "platforms;android-34 build-tools;34.0.0"

    - name: Setup Gradle 8.7
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Generate Android Project & Build APK
      run: |
        echo "📂 تنظيف وإنشاء مشروع أندرويد جديد..."
        rm -rf android_project
        
        mkdir -p android_project/app/src/main/assets/www
        mkdir -p android_project/app/src/main/res/values
        mkdir -p android_project/app/src/main/java/com/uranium/matrix/nexus
        
        # نسخ ملفات الويب
        if [ -f "app.js" ]; then cp app.js android_project/app/src/main/assets/www/; fi
        if [ -f "package.json" ]; then cp package.json android_project/app/src/main/assets/www/; fi
        cp *.html android_project/app/src/main/assets/www/ 2>/dev/null || echo "لا توجد ملفات HTML"
        
        # إنشاء index.html افتراضي إذا لم يكن موجوداً
        if [ ! -f "android_project/app/src/main/assets/www/index.html" ]; then
          cat << 'EOF' > android_project/app/src/main/assets/www/index.html
        <!DOCTYPE html>
        <html>
        <head><meta charset="UTF-8"><title>Uranium Nexus</title></head>
        <body style="background:#000;color:#0f0;font-family:monospace;padding:20px;">
          <h1>Uranium Matrix Nexus v1000</h1>
          <p>جاري التشغيل...</p>
          <script src="app.js"></script>
        </body>
        </html>
        EOF
        fi
        
        # ملف strings.xml (اسم التطبيق)
        cat << 'EOF' > android_project/app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Uranium Matrix Nexus</string>
        </resources>
        EOF
        
        # ملف build.gradle الرئيسي
        cat << 'EOF' > android_project/build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.5.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # ملف settings.gradle
        cat << 'EOF' > android_project/settings.gradle
        rootProject.name = "UraniumNexus"
        include ':app'
        EOF

        # ملف build.gradle الخاص بالتطبيق
        cat << 'EOF' > android_project/app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.uranium.matrix.nexus'
            compileSdk 34
            defaultConfig {
                applicationId "com.uranium.matrix.nexus"
                minSdk 21
                targetSdk 34
                versionCode 1000
                versionName "1.0.0"
            }
            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        EOF

        # ملف AndroidManifest.xml (بدون أيقونة مخصصة)
        cat << 'EOF' > android_project/app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.uranium.matrix.nexus">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Material.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # ملف MainActivity.java
        cat << 'EOF' > android_project/app/src/main/java/com/uranium/matrix/nexus/MainActivity.java
        package com.uranium.matrix.nexus;
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebView;
        import android.webkit.WebSettings;
        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webView.loadUrl("file:///android_asset/www/index.html");
                setContentView(webView);
            }
        }
        EOF

        cd android_project
        gradle wrapper --gradle-version 8.7 --distribution-type bin
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon --warning-mode=none

    - name: Upload Nexus Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Uranium-Matrix-Nexus-v1000-APK
        path: "android_project/app/build/outputs/apk/release/*.apk"
