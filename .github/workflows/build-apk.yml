name: Build Uranium Matrix Nexus v1000 APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: "latest"
        packages: "platforms;android-33 build-tools;33.0.2"

    - name: Setup Compatible Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Release APK
      run: |
        # طباعة محتويات المستودع للتحقق من المسارات
        echo "📂 محتويات مجلد الجذر الحالي:"
        ls -la
        
        # البحث عن ملف gradlew والدخول إلى مجلده مباشرة
        GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "❌ خطأ: لم يتم العثور على ملف gradlew في المستودع بالكامل!"
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "✅ تم العثور على ملف gradlew داخل المجلد: $PROJECT_DIR"
        
        # الانتقال المباشر لمجلد المشروع وتوليد ملف APK
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload Nexus Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Uranium-Matrix-Nexus-v1000-APK
        path: "**/build/outputs/apk/release/*.apk"
