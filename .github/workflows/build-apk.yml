name: Build Uranium Matrix Nexus v1000 APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: "latest"
        packages: "platforms;android-33 build-tools;33.0.2"

    - name: Setup Compatible Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Generate Wrapper & Build Release APK
      run: |
        cd android
        # توليد ملف gradlew تلقائياً إذا لم يكن موجوداً وبإصدار متوافق
        if [ ! -f "gradlew" ]; then
          echo "Generating Gradle wrapper..."
          gradle wrapper --gradle-version 8.5
        fi
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload Nexus Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Uranium-Matrix-Nexus-v1000-APK
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
