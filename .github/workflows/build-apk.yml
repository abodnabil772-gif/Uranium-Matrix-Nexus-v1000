name: Build Uranium Matrix Nexus v1000 APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: "latest"
        packages: "platforms;android-33 build-tools;33.0.2"

    - name: Setup Compatible Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Initialize Android Project & Build APK
      run: |
        echo "📂 فحص محتويات المستودع:"
        ls -la
        
        # إذا لم يكن مجلد android يحتوي على gradlew، سنقوم بإنشاء مشروع أندرويد قياسي أو استخدام Cordova إذا وجد package.json
        if [ -f "package.json" ]; then
          echo "📦 تم اكتشاف مشروع Node.js/Cordova، جاري تثبيت الحزم..."
          npm install
          
          # التحقق من وجود منصة أندرويد أو إضافتها
          if [ ! -d "android" ]; then
            npx cordova platform add android || echo "لا تستخدم كوردوا، سنتعامل مع المشروع المباشر"
          fi
        fi
        
        # البحث من جديد عن gradlew بعد التجهيز
        GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "⚠️ تنبيه: ملف gradlew غير موجود نهائياً، جاري إنشاء Gradle Wrapper افتراضي..."
          gradle wrapper --gradle-version 8.5
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
        fi
        
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "✅ الانتقال إلى مجلد العمل: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload Nexus Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Uranium-Matrix-Nexus-v1000-APK
        path: "**/build/outputs/apk/release/*.apk"
