name: Build Uranium Matrix Nexus v1000 APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: "latest"
        packages: "platforms;android-33 build-tools;33.0.2"

    - name: Setup Compatible Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Release APK
      run: |
        # البحث عن ملف gradlew أو الدخول لمجلد المشروع تلقائياً
        if [ -d "android" ]; then
          cd android
        elif [ -d "UraniumMatrixNexus" ]; then
          cd UraniumMatrixNexus
        fi
        
        # التأكد من وجود ملف gradlew وصلاحيات التنفيذ
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload Nexus Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Uranium-Matrix-Nexus-v1000-APK
        path: "**/build/outputs/apk/release/app-release-unsigned.apk"
